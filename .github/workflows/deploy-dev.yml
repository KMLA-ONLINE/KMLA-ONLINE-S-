name: Deploy dev

# Every push to `dev` runs CI, then deploys the dev Supabase project and the
# `dev` Vercel Preview from that one commit, so dev only ever holds merged
# migrations. The database goes first: the Preview must never run ahead of its
# schema. Secrets live in the `Development` Environment, limited to `dev`, under
# the same names as in `Production`; each job reads only its own Environment.
on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Only the current `dev` head deploys; a newer run deploys everything an older
  # one holds. ci.yml's concurrency already runs `dev` CI one push at a time, so
  # this skips a run whose CI finished after `dev` moved on, and a rerun of an
  # old run, either of which would move the `dev` Preview back to an older
  # commit. The deploy job checks again before touching the database, because a
  # rerun of the deploy job alone reuses this job's old output.
  latest:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA because dev is now $head." >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: latest
    if: needs.latest.outputs.current == 'true'
    # One dev deployment at a time, and never cancel one halfway through its
    # migrations. A newer push waiting here replaces an older one still waiting.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Development
      url: ${{ steps.deploy_vercel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup

      - name: Validate deployment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_ID \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            VERCEL_TOKEN
          do
            if [[ -z "${!name}" ]]; then
              echo "Development environment value is missing: $name" >&2
              exit 1
            fi
          done

          if [[ "$SUPABASE_PROJECT_ID" != "trftjcieogrewqptgidd" ]]; then
            echo "Refusing unexpected Supabase project $SUPABASE_PROJECT_ID." >&2
            exit 1
          fi

      - name: Preflight Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --yes
          npx supabase db push \
            --linked \
            --dry-run
          npx supabase functions list \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preflight Vercel
        id: preflight_vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/vercel.mjs preflight

      - name: Confirm dev head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA because dev is now $head." >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy database migrations
        if: steps.head.outputs.current == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --yes

      - name: Deploy Edge Functions
        if: steps.head.outputs.current == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: >-
          npx supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api

      - name: Deploy Vercel Preview
        id: deploy_vercel
        if: steps.head.outputs.current == 'true'
        env:
          DEPLOY_REF: dev
          DEPLOY_SHA: ${{ github.sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ steps.preflight_vercel.outputs.name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/vercel.mjs preview
