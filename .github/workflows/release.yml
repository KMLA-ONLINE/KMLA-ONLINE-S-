name: Release

# Every push to main runs CI first, then deploys prod. Only repository admins
# can merge into main (the `Main admins only` ruleset), so the merge is the
# release decision and the `Production` Environment has no required reviewers;
# it keeps the prod secrets and allows only `main`. Secrets exist only in this
# workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # firefox, webkit and the mobile projects still have failures of their
    # own, so the release gate is chromium for now. Switch to `all` once the
    # full suite passes in CI (run it from the Actions tab with E2E `all`).
    with:
      e2e-suite: chromium

  production-release:
    name: Production release
    needs: ci
    # One release at a time, and never cancel one that is deploying. The lock is
    # on this job, not the workflow, so CI for a newer push still runs while an
    # older release deploys. Only the newest pending release waits for the
    # lock, and one that is no longer the head of main refuses itself as stale.
    concurrency:
      group: release-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Production
      url: ${{ steps.deploy_vercel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup

      - name: Validate release configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_ID \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            VERCEL_TOKEN
          do
            if [[ -z "${!name}" ]]; then
              echo "Production environment value is missing: $name" >&2
              exit 1
            fi
          done

          if [[ "$SUPABASE_PROJECT_ID" != "nvgtzkylunpefdvonioo" ]]; then
            echo "Refusing unexpected Supabase project $SUPABASE_PROJECT_ID." >&2
            exit 1
          fi

      - name: Refuse a stale release
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk '{ print $1 }')"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo "Refusing to release $GITHUB_SHA because main is now $current_main." >&2
            exit 1
          fi

      - name: Preflight Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --yes
          npx supabase db push \
            --linked \
            --dry-run
          npx supabase functions list --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preflight Vercel
        id: preflight_vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/vercel.mjs preflight

      # Checked again right before the first irreversible step, since main can
      # move while the preflights run.
      - name: Deploy database migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk '{ print $1 }')"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo "Refusing to release $GITHUB_SHA because main is now $current_main." >&2
            exit 1
          fi
          npx supabase db push --linked --yes

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: >-
          npx supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api

      - name: Deploy Vercel production
        id: deploy_vercel
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ steps.preflight_vercel.outputs.name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release/vercel.mjs deploy
