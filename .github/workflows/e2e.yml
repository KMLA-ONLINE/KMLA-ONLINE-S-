name: E2E

# `ci.yml` calls this on every PR and `dev` push with `chromium`, and
# `release.yml` passes `all` through `ci.yml` so every configured browser runs
# before a production release. It can also be started by hand from the Actions
# tab. The caller's concurrency group covers a called run.
on:
  workflow_call:
    inputs:
      suite:
        description: "`chromium` for the chromium project only, `all` for every project in playwright.config.ts."
        type: string
        required: true
  workflow_dispatch:
    inputs:
      suite:
        description: Which Playwright projects to run
        type: choice
        options: [all, chromium]
        default: all

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # mobile-chrome runs on chromium and mobile-safari on webkit, so `all`
      # needs exactly these three engines.
      - name: Select Playwright projects
        id: suite
        shell: bash
        run: |
          case "$SUITE" in
            chromium)
              echo "browsers=chromium" >> "$GITHUB_OUTPUT"
              echo "args=--project=chromium" >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo "browsers=chromium firefox webkit" >> "$GITHUB_OUTPUT"
              echo "args=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown E2E suite: $SUITE" >&2
              exit 1
              ;;
          esac

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ inputs.suite }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ steps.playwright-cache.outputs.cache-hit == 'true' && '--only-shell' || '' }} ${{ steps.suite.outputs.browsers }}

      # The suite asserts a live Supabase connection, so the local stack has to
      # be up before the app is built. Docker is preinstalled on ubuntu runners.
      - name: Start Supabase
        run: npx supabase start

      # Read the URL and key back from the running stack instead of hardcoding
      # them, so a port change in supabase/config.toml cannot desync CI.
      - name: Export Supabase env
        run: |
          eval "$(npx supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        run: npm run e2e -- ${{ steps.suite.outputs.args }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.suite }}
          path: playwright-report/
          retention-days: 30
