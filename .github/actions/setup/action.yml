name: Set up Node project
description: Install the Node version from .nvmrc and the locked npm dependencies.

# A local action can only be read after checkout, so every job still checks out
# the repository itself before using this.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
